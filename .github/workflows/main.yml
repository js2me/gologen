name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ts:check
      - run: pnpm build
      - run: node scripts/test.mjs
      - run: node scripts/perf-test.mjs
      - run: pnpm exec size-limit
      - run: pnpm docs:build
